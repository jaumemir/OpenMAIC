<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-labelledby="gencat-logo-title">
  <title id="gencat-logo-title">Generalitat de Catalunya</title>
  <!-- Red senyal (4-part symbol, symmetric) -->
  <g fill="#cc0000">
    <!-- Upper left ramel -->
    <circle cx="10" cy="10" r="4"/>
    <circle cx="18" cy="6" r="3"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="14" cy="14" r="2.5"/>
    <!-- Upper right ramel -->
    <circle cx="30" cy="10" r="4"/>
    <circle cx="22" cy="6" r="3"/>
    <circle cx="34" cy="18" r="3"/>
    <circle cx="26" cy="14" r="2.5"/>
    <!-- Lower left ramel -->
    <circle cx="10" cy="30" r="4"/>
    <circle cx="18" cy="34" r="3"/>
    <circle cx="6" cy="22" r="3"/>
    <circle cx="14" cy="26" r="2.5"/>
    <!-- Lower right ramel -->
    <circle cx="30" cy="30" r="4"/>
    <circle cx="22" cy="34" r="3"/>
    <circle cx="34" cy="22" r="3"/>
    <circle cx="26" cy="26" r="2.5"/>
  </g>
  <!-- Logotype text -->
  <text x="48" y="16" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="11" fill="#333333">Generalitat</text>
  <text x="48" y="30" font-family="Helvetica Neue, Arial, sans-serif" font-weight="300" font-size="11" fill="#333333">de Catalunya</text>
</svg>
